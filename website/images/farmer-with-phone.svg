<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="50" fill="#FDD835" opacity="0.8"/>
  
  <!-- Field -->
  <rect y="300" width="800" height="300" fill="url(#fieldGradient)"/>
  
  <!-- Farmer silhouette with phone -->
  <g transform="translate(250, 200)">
    <!-- Body -->
    <ellipse cx="60" cy="180" rx="40" ry="60" fill="#5D4037"/>
    
    <!-- Head -->
    <circle cx="60" cy="100" r="30" fill="#8D6E63"/>
    
    <!-- Turban -->
    <ellipse cx="60" cy="85" rx="35" ry="20" fill="#F4511E"/>
    
    <!-- Arm holding phone -->
    <rect x="80" y="140" width="15" height="60" fill="#8D6E63" rx="7"/>
    
    <!-- Phone -->
    <rect x="90" y="130" width="35" height="55" rx="3" fill="#424242"/>
    <rect x="93" y="135" width="29" height="45" rx="2" fill="#4CAF50"/>
    
    <!-- Other arm -->
    <rect x="25" y="140" width="15" height="60" fill="#8D6E63" rx="7"/>
    
    <!-- Legs -->
    <rect x="40" y="230" width="15" height="70" fill="#5D4037" rx="7"/>
    <rect x="65" y="230" width="15" height="70" fill="#5D4037" rx="7"/>
  </g>
  
  <!-- Crops/plants in background -->
  <g opacity="0.6">
    <line x1="50" y1="400" x2="50" y2="350" stroke="#2E7D32" stroke-width="3"/>
    <line x1="50" y1="360" x2="40" y2="350" stroke="#2E7D32" stroke-width="2"/>
    <line x1="50" y1="360" x2="60" y2="350" stroke="#2E7D32" stroke-width="2"/>
    
    <line x1="150" y1="420" x2="150" y2="370" stroke="#2E7D32" stroke-width="3"/>
    <line x1="150" y1="380" x2="140" y2="370" stroke="#2E7D32" stroke-width="2"/>
    <line x1="150" y1="380" x2="160" y2="370" stroke="#2E7D32" stroke-width="2"/>
    
    <line x1="550" y1="410" x2="550" y2="360" stroke="#2E7D32" stroke-width="3"/>
    <line x1="550" y1="370" x2="540" y2="360" stroke="#2E7D32" stroke-width="2"/>
    <line x1="550" y1="370" x2="560" y2="360" stroke="#2E7D32" stroke-width="2"/>
    
    <line x1="650" y1="430" x2="650" y2="380" stroke="#2E7D32" stroke-width="3"/>
    <line x1="650" y1="390" x2="640" y2="380" stroke="#2E7D32" stroke-width="2"/>
    <line x1="650" y1="390" x2="660" y2="380" stroke="#2E7D32" stroke-width="2"/>
  </g>
  
  <!-- Text overlay -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFF">
    KrisiBandhu
  </text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FFF">
    Empowering Farmers with Technology
  </text>
</svg>
